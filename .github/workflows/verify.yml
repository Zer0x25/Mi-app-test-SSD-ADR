name: Quality Gate Determinista

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  verify:
    name: Ejecución de Quality Gate
    runs-on: ubuntu-latest
    env:
      NODE_ENV: test
      DATABASE_URL: "file:./prisma/dev.db"
      JWT_SECRET: "super_secreto_medidores_ci_github_actions_123456"
      JWT_EXPIRES_IN: "8h"

    steps:
      - name: Clonar repositorio
        uses: actions/checkout@v4

      - name: Configurar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: ${{ hashFiles('package-lock.json') != '' && 'npm' || '' }}

      - name: Instalar dependencias (si aplica)
        run: |
          if [ -f "package-lock.json" ]; then
            npm ci
          elif [ -f "package.json" ]; then
            npm install
          else
            echo "Repositorio en fase de semilla (Hito 0): omitiendo instalación de paquetes."
          fi

      - name: Generar cliente de Prisma
        run: |
          if [ -f "prisma/schema.prisma" ]; then
            npx prisma generate
          fi

      - name: Preparar entorno
        run: |
          if [ ! -f ".env" ] && [ -f ".env.example" ]; then
            cp .env.example .env
          fi

      - name: Permisos de ejecución para scripts
        run: chmod +x scripts/*.sh

      - name: Ejecutar Quality Gate
        run: ./scripts/verify.sh

      - name: Validar empaquetado Docker
        run: docker build -t sistema-medidores:ci-test .

